<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Cleaning — Ishga ariza</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef6f1;
      font-family: Arial, sans-serif;
      color: #163c2b;
    }
    main {
      width: 100%;
      max-width: 460px;
      padding: 40px 28px;
      background: white;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 40px #163c2b12;
    }
    .brand {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #087345;
    }
    h1 { font-size: 30px; line-height: 1.2; }
    p { line-height: 1.7; color: #52645b; }
    a {
      display: block;
      margin-top: 26px;
      padding: 18px;
      border-radius: 12px;
      background: #087345;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { background: #065a36; }
    a:focus-visible { outline: 3px solid #163c2b; outline-offset: 4px; }
    small {
      display: block;
      margin-top: 18px;
      color: #52645b;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">DOCTOR CLEANING</div>
    <h1>Jamoamizga qo‘shiling!</h1>
    <p>
      Qarshi shahridagi Doctor Cleaning kompaniyasiga
      ishga ariza topshirish uchun Telegram botimizga o‘ting.
    </p>
    <a href="https://t.me/doctor_cleaning_hr_bot">
      Telegram orqali ariza topshirish
    </a>
    <small>
      Bot ochilgach, “Start” yoki “Boshlash”
      tugmasini bosing va savollarga javob bering.
    </small>
  </main>
</body>
</html>
